# Generates the contribution-grid snake animation daily and publishes it to
# the `output` branch. The profile README embeds it via raw.githubusercontent URL.
#
# Setup: just commit this file to humoge7502/humoge7502 — no secrets needed
# (it uses the default GITHUB_TOKEN with contents write permission).
# First run: Actions tab → "Generate Snake" → Run workflow.

name: Generate Snake

on:
  schedule:
    - cron: "0 2 * * *" # daily at 02:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
