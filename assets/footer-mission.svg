<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="240" viewBox="0 0 1400 240" role="img" aria-label="Mission passed">
<defs>
  <filter id="fglow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#FF2D95" flood-opacity="0.9"/></filter>
  <filter id="fglow2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFB703" flood-opacity="0.9"/></filter>
</defs>
<style>
  .mp{animation:mpin 1s cubic-bezier(.2,2,.4,1) both, mpp 3.2s ease-in-out 1.1s infinite;}
  @keyframes mpin{0%{opacity:0;transform:scale(0.7)}100%{opacity:1;transform:scale(1)}}
  @keyframes mpp{0%,100%{filter:drop-shadow(0 0 4px #FF2D95)}50%{filter:drop-shadow(0 0 14px #FF2D95)}}
  .rsp{animation:rsin 0.8s ease-out 0.5s both;}
  @keyframes rsin{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
  .ray{transform-origin:700px 96px;animation:rayspin 26s linear infinite;}
  @keyframes rayspin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
</style>
<rect width="1400" height="240" rx="22" fill="#0A0118" stroke="#9D4EDD" stroke-width="2" stroke-opacity="0.6"/>
<g class="ray" opacity="0.12">
