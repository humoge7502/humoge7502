<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="26" viewBox="0 0 1200 26" role="img" aria-label="divider">
<defs>
  <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FF2D95"/><stop offset="0.35" stop-color="#9D4EDD"/>
    <stop offset="0.7" stop-color="#00F0FF"/><stop offset="1" stop-color="#FF2D95"/>
  </linearGradient>
  <clipPath id="clip"><rect x="60" y="8" width="1080" height="10" rx="5"/></clipPath>
  <filter id="dglow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#9D4EDD" flood-opacity="0.9"/></filter>
</defs>
<style>
  .dslide{animation:dslide 5s linear infinite;}
  @keyframes dslide{0%{transform:translateX(-600px)}100%{transform:translateX(0px)}}
  .diamond{animation:diam 2.4s ease-in-out infinite;transform-origin:600px 13px;transform-box:view-box;}
  @keyframes diam{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(225deg) scale(1.3)}}
</style>
<g clip-path="url(#clip)" filter="url(#dglow)">
  <rect class="dslide" x="0" y="8" width="1800" height="10" fill="url(#dg)"/>
</g>
<rect class="diamond" x="593" y="6" width="14" height="14" fill="#FFB703" transform="rotate(45 600 13)"/>
</svg>