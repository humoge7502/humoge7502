# Optional: lowlighter/metrics — renders a rich SVG metrics panel for the profile.
#
# Setup (one-time, ~3 minutes):
#   1. Create a fine-grained PAT at github.com/settings/personal-access-tokens/new
#      with read access to: account, commits, issues, organizations, pull requests
#   2. In humoge7502/humoge7502 → Settings → Secrets and variables → Actions →
#      add secret METRICS_TOKEN = <the token>
#   3. Actions tab → "Metrics" → Run workflow
#   4. Embed in README with:
#      <img src="https://raw.githubusercontent.com/humoge7502/humoge7502/output/metrics.svg"/>
#
# Until configured, this workflow is manual-trigger only and will not fail CI.

name: Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly Monday 03:00 UTC

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: humoge7502
          template: terminal
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_stars: yes
          plugin_lines: yes
          output_svg: metrics.svg
          output_action: none
          config_output: dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
