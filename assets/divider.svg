<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" role="img" aria-label="HUD section divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="40" fill="transparent"/>
  <line x1="96" y1="20" x2="1104" y2="20" stroke="url(#g)" stroke-width="1.5"/>
  <g fill="#22D3EE">
    <rect x="90" y="14" width="12" height="12" rx="2" transform="rotate(45 96 20)"/>
  </g>
  <g fill="#A78BFA">
    <rect x="1098" y="14" width="12" height="12" rx="2" transform="rotate(45 1104 20)"/>
  </g>
  <circle r="3" fill="#67E8F9">
    <animate attributeName="cx" values="96;1104" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="20;20" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>