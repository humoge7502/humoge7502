<text x="700" y="200" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="600" font-size="17" letter-spacing="3" fill="#B8A8D9">NEXT MISSION: BUILDING THE UNBREAKABLE &#183; CO-OP WITH YOU?</text>
