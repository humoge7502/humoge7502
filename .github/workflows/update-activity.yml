# ---------------------------------------------------------------------------
# Self-built "Recent Activity" feed for the profile README.
#
# WHAT IT DOES
#   Once a day (03:00 UTC) or on demand, this workflow:
#     1. calls the GitHub REST API via `gh api` (first-party CLI — no
#        third-party marketplace action) to fetch the account's most recent
#        public events,
#     2. formats up to 5 of them as markdown list items — push events show the
#        repo short name plus the first line of the head commit message, other
#        event types get a friendly label, everything HTML/markdown-escaped —
#        and
#     3. rewrites only the block between the <!-- START:ACTIVITY --> and
#        <!-- END:ACTIVITY --> markers in README.md, then commits the result
#        with a [skip ci] message using plain git.
#
# SECRETS NEEDED
#   None beyond the default GITHUB_TOKEN (granted contents: write below).
#   No PATs, no external services, no third-party actions.
#
# FIRST RUN
#   Commit this file together with the README (which already contains the
#   START/END markers), then: Actions tab → "Update Recent Activity" →
#   Run workflow. Until real public events exist, the honest placeholder lines
#   between the markers are left exactly as they are.
#
# DEFENSIVE DESIGN (the placeholders are never wiped on failure)
#   - gh api failure / empty payload / unparsable JSON → exit 0, README
#     untouched.
#   - Events from this profile repo itself are skipped, otherwise the
#     workflow's own "[skip ci]" pushes would flood the feed.
#   - Only first lines of commit messages are used (bodies are never
#     included), truncated to 80 chars, HTML- and markdown-escaped.
#   - Output is capped at 5 lines; identical content → no commit at all.
# ---------------------------------------------------------------------------

name: Update Recent Activity

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  update-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile repo
        uses: actions/checkout@v4

      - name: Fetch events and rewrite the activity block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          EVENTS_FILE="$(mktemp)"

          # 1) Fetch the most recent public events. On ANY failure: warn and
          #    leave README.md exactly as it is (placeholders survive).
          if ! gh api "users/${GITHUB_REPOSITORY_OWNER}/events/public?per_page=30" \
              > "${EVENTS_FILE}" 2> "${EVENTS_FILE}.err"; then
            echo "::warning::gh api failed — leaving the activity block untouched."
            cat "${EVENTS_FILE}.err" || true
            exit 0
          fi

          # 2) Filter, format and splice the block between the markers.
          #    The python heredoc exits 0 without touching the file on any
          #    unexpected payload (empty list, error object, missing markers).
          python3 - "${EVENTS_FILE}" <<'PY'
          import json
          import os
          import re
          import sys

          MAX_ITEMS = 5   # hard cap on rendered lines
          MSG_MAX = 80    # commit/PR/issue title truncation length
          README = "README.md"
          START = "<!-- START:ACTIVITY -->"
          END = "<!-- END:ACTIVITY -->"
          EVENTS_PATH = sys.argv[1]

          ICONS = {
              "PushEvent": "🚀",
              "CreateEvent": "🆕",
              "DeleteEvent": "🗑️",
              "ForkEvent": "🍴",
              "IssueCommentEvent": "💬",
              "IssuesEvent": "📋",
              "PublicEvent": "🎉",
              "PullRequestEvent": "🔀",
              "PullRequestReviewCommentEvent": "💬",
              "PullRequestReviewEvent": "🔍",
              "ReleaseEvent": "🏷️",
              "WatchEvent": "⭐",
          }

          def clean(text):
              """First line only; HTML- and markdown-escaped; truncated."""
              if not text:
                  return ""
              first = text.strip().splitlines()[0].strip()
              first = first.replace("<", "&lt;").replace(">", "&gt;")
              first = re.sub(r"([\\`*_\[\]])", r"\\\1", first)
              if len(first) > MSG_MAX:
                  first = first[: MSG_MAX - 1].rstrip() + "…"
              return first

          def short_repo(full):
              """humoge7502/q-trust -> q-trust"""
              return full.split("/")[-1] if full else "unknown"

          # Events generated by this very workflow (pushes to the profile
          # repo) would be pure "[skip ci]" noise — skip them.
          profile_repo = os.environ.get("GITHUB_REPOSITORY", "")

          try:
              with open(EVENTS_PATH, encoding="utf-8") as fh:
                  events = json.load(fh)
          except (OSError, ValueError) as exc:
              print(f"::warning::cannot read events payload ({exc}) — README left untouched")
              sys.exit(0)

          if not isinstance(events, list) or not events:
              print("::warning::no public events returned — README left untouched")
              sys.exit(0)

          items = []
          for ev in events:
              if len(items) >= MAX_ITEMS:
                  break
              etype = ev.get("type") or ""
              repo_full = (ev.get("repo") or {}).get("name") or ""
              if not repo_full or repo_full == profile_repo:
                  continue
              repo = "**" + short_repo(repo_full) + "**"
              payload = ev.get("payload") or {}
              icon = ICONS.get(etype, "📦")

              if etype == "PushEvent":
                  commits = payload.get("commits") or []
                  if not commits:
                      continue  # push event without commits — nothing honest to show
                  head = commits[-1]  # newest commit of the push
                  msg = clean(head.get("message", ""))
                  if not msg:
                      continue
                  sha = (payload.get("head") or head.get("sha") or "")[:7]
                  suffix = " (" + sha + ")" if sha else ""
                  items.append(f"- {icon} pushed to {repo} · {msg}{suffix}")
              elif etype == "IssuesEvent":
                  title = clean((payload.get("issue") or {}).get("title", ""))
                  action = payload.get("action") or "updated"
                  detail = f" — “{title}”" if title else ""
                  items.append(f"- {icon} {action} an issue in {repo}{detail}")
              elif etype == "PullRequestEvent":
                  title = clean((payload.get("pull_request") or {}).get("title", ""))
                  action = payload.get("action") or "updated"
                  detail = f" — “{title}”" if title else ""
                  items.append(f"- {icon} {action} a pull request in {repo}{detail}")
              elif etype == "ReleaseEvent":
                  tag = clean((payload.get("release") or {}).get("tag_name", ""))
                  detail = " " + tag if tag else ""
                  items.append(f"- {icon} published release{detail} in {repo}")
              elif etype == "CreateEvent":
                  ref_type = payload.get("ref_type") or "repository"
                  items.append(f"- {icon} created {ref_type} in {repo}")
              elif etype == "WatchEvent":
                  items.append(f"- {icon} starred {repo}")
              elif etype == "ForkEvent":
                  items.append(f"- {icon} forked {repo}")
              elif etype == "PublicEvent":
                  items.append(f"- {icon} open-sourced {repo}")
              else:
                  label = re.sub(r"(?<=[a-z])(?=[A-Z])", " ", etype or "activity")
                  label = label.replace("Event", "").strip() or "activity"
                  items.append(f"- {icon} {label.lower()} in {repo}")

          if not items:
              print("::warning::no formattable events — README left untouched")
              sys.exit(0)

          try:
              with open(README, encoding="utf-8") as fh:
                  content = fh.read()
          except OSError as exc:
              print(f"::error::cannot read {README}: {exc}")
              sys.exit(1)

          if START not in content or END not in content:
              print("::warning::activity markers not found — README left untouched")
              sys.exit(0)

          block = START + "\n" + "\n".join(items) + "\n" + END
          pattern = re.compile(re.escape(START) + r".*?" + re.escape(END), re.DOTALL)
          # Replacement via a callable so backslashes in escaped text stay literal.
          new_content, count = pattern.subn(lambda _m: block, content, count=1)

          if count != 1 or new_content == content:
              print("Activity block already up to date — nothing to do.")
              sys.exit(0)

          with open(README, "w", encoding="utf-8") as fh:
              fh.write(new_content)
          print(f"Rewrote the activity block with {len(items)} item(s).")
          PY

      - name: Commit and push (only if the README changed)
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md; then
            echo "No activity changes — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh recent activity [skip ci]"
          git push
