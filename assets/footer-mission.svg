</g>
<text class="mp" x="700" y="112" text-anchor="middle" font-family="'Arial Black','Segoe UI',Arial,sans-serif" font-weight="900" font-style="italic" font-size="76" fill="#F3EFFF" filter="url(#fglow)">MISSION PASSED</text>
<g class="rsp">
<text x="700" y="158" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="26" letter-spacing="6" fill="#FFB703" filter="url(#fglow2)">+ RESPECT &#160;&#183;&#160; + REPUTATION</text>
