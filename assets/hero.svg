<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Krishna Puri — systems engineer. Command-deck hero: two flagship engines online (VoltHub CSMS: Oracle OLTP + TimescaleDB telemetry + OCPP gateway; Q-Trust: post-quantum CBOM scanner + Base L2 attestation), full-profile benchmarks pending.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B101C"/>
      <stop offset="0.55" stop-color="#0A0E17"/>
      <stop offset="1" stop-color="#070A11"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070C" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#1E293B" stroke-opacity="0.5" stroke-width="1"/>
    </pattern>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="150" cy="250" r="60"/>
    </clipPath>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="540" fill="url(#bgGrad)"/>
  <rect width="1200" height="540" fill="url(#grid)"/>
  <rect width="1200" height="540" fill="url(#vignette)"/>
  <ellipse cx="1050" cy="80" rx="420" ry="260" fill="url(#glowViolet)"/>
  <ellipse cx="240" cy="470" rx="380" ry="220" fill="url(#glowCyan)"/>

  <!-- corner brackets -->
  <g stroke="#22D3EE" stroke-opacity="0.85" stroke-width="2" fill="none">
    <path d="M 24 52 L 24 24 L 52 24"/>
    <path d="M 1148 24 L 1176 24 L 1176 52"/>
    <path d="M 1176 488 L 1176 516 L 1148 516"/>
    <path d="M 52 516 L 24 516 L 24 488"/>
  </g>

  <!-- top status bar -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#8B98A9">
    <text x="44" y="38">HUMOGE7502 // PROFILE.README</text>
    <text x="900" y="38" text-anchor="end" fill="#8B98A9">BUILD 2026.09.06</text>
  </g>
  <circle cx="1088" cy="34" r="4" fill="#34D399">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- avatar with rotating HUD ring -->
  <g>
    <circle cx="150" cy="250" r="74" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8 10" stroke-opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0 150 250" to="360 150 250" dur="36s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="250" r="64" fill="#0D1526" stroke="#1E293B" stroke-width="2"/>
    <image href="avatar.png" x="90" y="190" width="120" height="120" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)"/>
    <circle cx="150" cy="250" r="60" fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>

  <!-- identity block -->
  <g filter="url(#softGlow)">
    <text x="262" y="228" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="7" fill="#E6EDF3">KRISHNA PURI</text>
  </g>
  <text x="266" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="6" fill="#22D3EE">SYSTEMS ENGINEER</text>
  <text x="266" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8B98A9">deterministic money paths · post-quantum · real-time telemetry</text>

  <!-- core systems panel -->
  <g>
    <rect x="764" y="120" width="404" height="272" rx="10" fill="#0D1526" fill-opacity="0.92" stroke="#1E293B" stroke-width="1.5"/>
    <path d="M 764 120 L 764 96 L 788 120 Z" fill="#22D3EE" fill-opacity="0.9"/>
    <text x="800" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#A78BFA">CORE SYSTEMS</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1">
      <text x="788" y="184" fill="#8B98A9">ORACLE 23AI OLTP</text>
      <circle cx="1098" cy="180" r="4" fill="#34D399"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="1104" y="184" fill="#34D399">ONLINE</text>

      <text x="788" y="216" fill="#8B98A9">TIMESCALE TELEMETRY</text>
      <circle cx="1098" cy="212" r="4" fill="#34D399"><animate attributeName="opacity" values="1;0.35;1" dur="2.1s" repeatCount="indefinite"/></circle>
      <text x="1104" y="216" fill="#34D399">ONLINE</text>

      <text x="788" y="248" fill="#8B98A9">OCPP 1.6J GATEWAY</text>
      <circle cx="1098" cy="244" r="4" fill="#34D399"><animate attributeName="opacity" values="1;0.35;1" dur="1.9s" repeatCount="indefinite"/></circle>
      <text x="1104" y="248" fill="#34D399">ONLINE</text>

      <text x="788" y="280" fill="#8B98A9">PQC CBOM SCANNER</text>
      <circle cx="1098" cy="276" r="4" fill="#34D399"><animate attributeName="opacity" values="1;0.35;1" dur="2.3s" repeatCount="indefinite"/></circle>
      <text x="1104" y="280" fill="#34D399">ONLINE</text>

      <text x="788" y="312" fill="#8B98A9">BASE L2 ATTESTATION</text>
      <circle cx="1098" cy="308" r="4" fill="#34D399"><animate attributeName="opacity" values="1;0.35;1" dur="2.05s" repeatCount="indefinite"/></circle>
      <text x="1104" y="312" fill="#34D399">ONLINE</text>

      <text x="788" y="344" fill="#8B98A9">FULL-PROFILE BENCH</text>
      <circle cx="1098" cy="340" r="4" fill="#FBBF24"><animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/></circle>
      <text x="1104" y="344" fill="#FBBF24">PENDING</text>
    </g>
    <rect x="788" y="362" width="356" height="2" fill="url(#lineGrad)"/>
  </g>

  <!-- terminal footer -->
  <g>
    <rect x="44" y="432" width="1112" height="64" rx="8" fill="#070B12" fill-opacity="0.95" stroke="#1E293B" stroke-width="1.5"/>
    <text x="68" y="468" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#22D3EE">$</text>
    <text x="88" y="468" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#E6EDF3">gh profile --engines volthub_csms,qtrust --discipline "trade-offs named, claims receipted, races proven in CI"</text>
    <rect x="1024" y="454" width="9" height="17" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="68" y="484" width="300" height="3" rx="1.5" fill="#1E293B"/>
    <rect x="68" y="484" width="80" height="3" rx="1.5" fill="url(#shimmer)">
      <animate attributeName="x" values="68;288" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- travelling signal pulse -->
  <circle r="3" fill="#67E8F9">
    <animate attributeName="cx" values="0;1200" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="520;520" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- scanline sweep -->
  <rect x="0" width="1200" height="2" fill="#67E8F9" fill-opacity="0.05">
    <animate attributeName="y" values="-2;540" dur="11s" repeatCount="indefinite"/>
  </rect>
</svg>