<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="SKILL TREE">
<defs>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="tclip"><text x="175" y="70" font-family="'Arial Black','Segoe UI',Arial,sans-serif" font-weight="900" font-style="italic" font-size="56" fill="#fff">SKILL TREE</text></clipPath>
  <filter id="hglow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#9D4EDD" flood-opacity="0.9"/></filter>
</defs>
<style>
  .hpanel{animation:hpanelf 7s ease-in-out infinite;}
  @keyframes hpanelf{0%,90%,100%{opacity:1}93%{opacity:0.82}96%{opacity:0.95}}
  .shine{animation:shinemove 4.5s ease-in-out infinite;}
  @keyframes shinemove{0%,55%{transform:translateX(-560px)}80%,100%{transform:translateX(760px)}}
  .hbar{animation:hbarp 2.6s ease-in-out infinite;}
  @keyframes hbarp{0%,100%{opacity:0.6}50%{opacity:1}}
</style>
<rect class="hpanel" x="6" y="10" width="988" height="130" rx="18" fill="#12041F" opacity="0.96" stroke="#9D4EDD" stroke-width="2"/>
<rect class="hbar" x="30" y="42" width="10" height="66" rx="5" fill="#9D4EDD"/>
<rect x="48" y="52" width="6" height="46" rx="3" fill="#00F0FF" opacity="0.85"/>
<text x="175" y="70" font-family="'Arial Black','Segoe UI',Arial,sans-serif" font-weight="900" font-style="italic" font-size="56" fill="#F3EFFF" filter="url(#hglow)">SKILL TREE</text>
<g clip-path="url(#tclip)"><rect class="shine" x="135" y="20" width="240" height="60" fill="url(#shine)"/></g>
<text x="175" y="106" font-family="'Segoe UI',Arial,sans-serif" font-weight="600" font-size="19" letter-spacing="4" fill="#00F0FF">LOADOUT &#183; WEAPONS OF CHOICE</text>
<text x="960" y="80" text-anchor="end" font-family="'Arial Black','Segoe UI',Arial,sans-serif" font-size="34" fill="#FFB703" opacity="0.95">&#9733;&#9733;&#9733;&#9733;&#9733;</text>
</svg>