# ═══════════════════════════════════════════════════════════════
# SNAKE CAM — animated contribution-grid snake
# Regenerates the snake SVG nightly and pushes it to the `output`
# branch. The README reads it from there. Zero manual maintenance.
# ═══════════════════════════════════════════════════════════════
name: generate snake

on:
  schedule: # runs at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch: # allows manual run from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # generates the snake SVGs (Vice-City palette: neon pink snake,
      # dark-mode dots fading pink → cyan)
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: humoge7502
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF2D95&color_dots=%231A0B2E,%237B2FFF,%23FF8C42,%23FF2D95,%2300F0FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300F0FF&color_dots=%230D0221,%233B0F63,%239D4EDD,%23FF2D95,%23FFB703

      # pushes the generated SVGs to the `output` branch
      - name: push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
